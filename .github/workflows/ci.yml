name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    name: Registry gate
    # The swiftui-registry tool is a macOS Swift package (CryptoKit, Synchronization); the
    # image's default Xcode builds it, and Node runs the website codec check inside swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: swift build
      - run: swift run swiftui-registry validate
      - run: swift run swiftui-registry generate catalog
      - run: swift run swiftui-registry generate showcase-manifest
      - run: swift run swiftui-registry generate site-data
      - name: Generated files must be committed
        run: git diff --exit-code -- docs/catalog Examples/Showcase Website/content
      - run: swift test
      - run: make format-check

  website:
    name: Website
    runs-on: macos-26
    needs: registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Export registry data and captures for the site
        run: swift run swiftui-registry generate site-data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - working-directory: Website
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact
