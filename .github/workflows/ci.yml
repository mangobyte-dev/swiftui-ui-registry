name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    name: Registry gate
    # The swiftui-registry tool is a macOS Swift package (CryptoKit, Synchronization); the
    # image's default Xcode builds it, and Node runs the website codec check inside swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: swift build
      - run: swift run swiftui-registry validate
      - run: swift run swiftui-registry generate catalog
      - run: swift run swiftui-registry generate showcase-manifest
      - run: swift run swiftui-registry generate site-data
      - run: swift run swiftui-registry generate item-tokens
      - name: Generated files must be committed
        run: git diff --exit-code -- docs/catalog Examples/Showcase Website/content Sources/SwiftUIRegistryDesignSurface/RegistryItemTokens.swift
      - run: swift test
      - run: make format-check

  website:
    name: Website
    runs-on: macos-26
    needs: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export registry data and captures for the site
        run: swift run swiftui-registry generate site-data
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - working-directory: Website
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm run build

  e2e:
    name: Website end-to-end
    # Playwright drives Chromium and a WebKit iPhone profile; WebKit needs macOS
    runs-on: macos-26
    needs: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export registry data and captures for the site
        run: swift run swiftui-registry generate site-data
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - working-directory: Website
        run: npm ci
      - name: Install Playwright browsers
        working-directory: Website
        run: npx playwright install --with-deps chromium webkit
      - working-directory: Website
        run: npm run build
      - working-directory: Website
        run: npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            Website/playwright-report
            Website/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact
